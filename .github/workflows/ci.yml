# One pipeline ending in "Pipeline Complete", the only required check (estate convention).
# Every check is its own job, and they run in parallel: a pull request waits for the slowest
# check rather than the sum of them, which is worth the extra minutes GitHub bills per job.
# Each job runs one `task`, the same tasks `task check` runs in sequence, so local and CI
# cannot drift.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every failure is reported, not only the first.
      fail-fast: false
      matrix:
        task: [lint, gen:check, "test:go", "test:integration", "test:web", build, secrets]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true

      - name: Run the task
        env:
          TASK: ${{ matrix.task }}
        run: mise exec -- task "$TASK"

  # The binary the e2e shards run, built once, and the Playwright version the lockfile resolves, so
  # the shards' image always carries the browsers that version expects, also after Renovate bumps it.
  e2e-build:
    name: End-to-end build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the Playwright version
        id: playwright
        run: |
          set -euo pipefail
          version="$(grep -m1 -E "^  '@playwright/test@[0-9]" pnpm-lock.yaml | sed -E "s/^  '@playwright\/test@([0-9][^']*)':.*/\1/")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "no @playwright/test version in pnpm-lock.yaml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Only what the build needs.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: go node pnpm task

      - name: Build the binary
        run: task build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-binary
          path: bin/template-go-vue
          retention-days: 1

  # Each device in its own job, split further with --shard as the suite grows. The official
  # Playwright image already holds the browsers and every system package they need, so no job waits
  # on an apt mirror, and Postgres is a service container, reached by its name.
  e2e:
    name: End-to-end (${{ matrix.project }} ${{ matrix.shard }})
    needs: e2e-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.e2e-build.outputs.playwright }}-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-retries 30
    env:
      # Firefox refuses a HOME the container's root user does not own; mise installs under it too.
      HOME: /root
      DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, phone]
        shard: [1/1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only what the suite needs; the image brings the browsers.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: node pnpm task

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-binary
          path: bin

      # An artifact does not keep the file mode.
      - run: chmod +x bin/template-go-vue

      - name: End-to-end with axe
        env:
          PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}
        run: task e2e:ci -- "--project=$PROJECT" "--shard=$SHARD"

      - name: Keep the shard's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: web/blob-report
          retention-days: 7

  # One HTML report from every shard, for reading a failure. Not part of Pipeline Complete.
  e2e-report:
    name: End-to-end report
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
          install_args: node pnpm task

      - name: Install JS tooling
        run: task install

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge the reports
        run: pnpm --filter @template-go-vue/web exec playwright merge-reports --reporter html ../all-blob-reports

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # The image builds need the Docker daemon the runner has, so they are not a task.
  images:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: template-go-vue
            args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        env:
          IMAGE: ${{ matrix.image }}
          ARGS: ${{ matrix.args }}
          PACKAGES_PROXY_TOKEN: ${{ secrets.PACKAGES_PROXY_TOKEN }}
        run: |
          set -euo pipefail
          # Same mechanism as the shared container-publish workflow: the key only travels
          # as BuildKit secret files, never as a build arg. Without the secret (a fork's
          # pull request) the image builds without the proxy.
          proxy_args=()
          if [ -n "$PACKAGES_PROXY_TOKEN" ]; then
            printf '::add-mask::%s\n' "$PACKAGES_PROXY_TOKEN"
            umask 077
            netrc="$RUNNER_TEMP/packages-netrc"
            {
              printf 'machine packages.jorisjonkers.dev\n'
              printf 'login packages\n'
              printf 'password %s\n' "$PACKAGES_PROXY_TOKEN"
            } > "$netrc"
            npmrc="$RUNNER_TEMP/packages-npmrc"
            {
              printf 'registry=https://packages.jorisjonkers.dev/npm/\n'
              printf '//packages.jorisjonkers.dev/npm/:_authToken=%s\n' "$PACKAGES_PROXY_TOKEN"
              printf '@jorisjonkers-dev:registry=https://npm.pkg.github.com\n'
            } > "$npmrc"
            proxy_args=(
              --secret "id=packages-netrc,src=$netrc"
              --secret "id=packages-npmrc,src=$npmrc"
              --build-arg GOPROXY=https://packages.jorisjonkers.dev/go
              --build-arg PIP_INDEX_URL=https://packages.jorisjonkers.dev/pypi/simple/
              --build-arg UV_DEFAULT_INDEX=https://packages.jorisjonkers.dev/pypi/simple/
            )
          fi
          # shellcheck disable=SC2086 # ARGS is a list of options, split on purpose
          docker build --build-arg VERSION=ci "${proxy_args[@]}" $ARGS -t "$IMAGE:ci" .

  # A skipped test whose quarantine ran out, names no issue, or lasts over 14 days fails the build
  # (workspace docs/testing-standards.md, section 7).
  quarantine:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/quarantine-check.yml@2814b76fc3f5bd4f02a6e4a0fa789f1307757daa # v0.45.4

  # Comments the mutants that survive on the lines a pull request changes. A report; it never fails
  # the build, so Pipeline Complete does not wait for it.
  mutation:
    if: ${{ github.event_name == 'pull_request' }}
    uses: JorisJonkers-dev/github-workflows/.github/workflows/mutation-report.yml@2814b76fc3f5bd4f02a6e4a0fa789f1307757daa # v0.45.4
    permissions:
      contents: read
      pull-requests: write
    with:
      go-directory: .
      web-directory: web
      require-package-proxy: true
    secrets:
      PACKAGES_PROXY_TOKEN: ${{ secrets.PACKAGES_PROXY_TOKEN }}

  # The one required check: green only when every job above is. `always()` so a failed or
  # cancelled job still reports here, as a failure, rather than leaving the check pending.
  pipeline-complete:
    name: Pipeline Complete
    if: ${{ always() }}
    needs: [check, e2e-build, e2e, images, quarantine]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a job ended ${result}"; exit 1; }
          done
