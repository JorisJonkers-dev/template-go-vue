# Local Postgres for `task dev` and `task e2e`. Published on 25432 so a Postgres already running
# on the default port does not collide with it, and below 32768 so it never lands in the range the
# OS hands out as ephemeral ports.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      retries: 30
